[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmblocks"
version = "0.1.0"
description = "A modular, enterprise-grade AI application framework for building sophisticated AI applications using a block-based architecture"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LLMBlocks Team", email = "team@llmblocks.dev"}
]
keywords = ["ai", "llm", "chatbot", "rag", "agent", "framework", "modular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    
    # Async and concurrency
    "asyncio-mqtt>=0.16.0",
    "aiofiles>=23.2.1",
    
    # LLM and AI frameworks
    "langchain>=0.3.26",
    "langchain-core>=0.3.75", 
    "langchain-openai>=0.3.32",
    "langchain-anthropic>=0.3.19",
    "langchain-google-genai>=2.1.10",
    "langgraph>=0.6.6",
    
    # Vector databases and embeddings
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    
    # Web framework for playground
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    
    # CLI and development tools
    "click>=8.1.7",
    "rich>=13.7.0",
    "typer>=0.9.0",
    
    # Utilities
    "httpx>=0.25.2",
    "tenacity>=8.2.3",
    "structlog>=23.2.0",
    "redis>=5.0.1",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "ipython>=8.17.2",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.8",
    "mkdocstrings[python]>=0.24.0",
]
deploy = [
    "docker>=6.1.3",
    "kubernetes>=28.1.0",
]

[project.urls]
Homepage = "https://github.com/llmblocks/llmblocks"
Documentation = "https://llmblocks.dev"
Repository = "https://github.com/llmblocks/llmblocks.git"
"Bug Tracker" = "https://github.com/llmblocks/llmblocks/issues"
"Changelog" = "https://github.com/llmblocks/llmblocks/blob/main/CHANGELOG.md"

[project.scripts]
llmblocks = "llmblocks.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmblocks"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/examples",
    "/tests",
    "/configs",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["llmblocks"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "langchain_google_genai.*",
    "langgraph.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/llmblocks"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]