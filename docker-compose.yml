# LLMBlocks Development Environment
version: '3.8'

services:
  # LLMBlocks application
  llmblocks:
    build:
      context: .
      target: development
    ports:
      - "8888:8888"  # Jupyter
      - "8000:8000"  # FastAPI (if used)
    volumes:
      - .:/home/app/workspace
      - llmblocks_data:/home/app/data
    environment:
      - LLMBLOCKS_ENV=development
      - LLMBLOCKS_ENABLE_LOGGING=true
      - LLMBLOCKS_LOG_FORMAT=pretty
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://llmblocks:password@postgres:5432/llmblocks
    depends_on:
      - redis
      - postgres
    networks:
      - llmblocks_network

  # Redis for memory backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - llmblocks_network

  # PostgreSQL for database backend
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=llmblocks
      - POSTGRES_USER=llmblocks
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llmblocks_network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - llmblocks_network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - llmblocks_network

volumes:
  llmblocks_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  llmblocks_network:
    driver: bridge
